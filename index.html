<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тап — печатай под видео</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Literata:wght@400;600&display=swap">
<style>
:root{--f:Literata,Georgia,serif}
[data-theme=dark]{--bg:#0f2326;--pn:#163135;--ink:#e6f4ee;--mu:#7fa3a0;--ln:#244447;--ac:#ffb347;--ok:#7fe0b0;--bad:#ff7a6b;color-scheme:dark}
[data-theme=light]{--bg:#eef3ef;--pn:#fff;--ink:#12302f;--mu:#5b7a77;--ln:#cfdcd8;--ac:#c76a00;--ok:#17805a;--bad:#c8402f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 56px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{margin:0;font:600 1.7rem var(--f);letter-spacing:-.01em}
h2{font-size:1rem;font-weight:600;margin:28px 0 8px}
button,input,select,textarea{font:inherit;color:var(--ink)}
input,select,textarea{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;width:100%}
button{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:11px 16px;cursor:pointer}
.go{background:var(--ac);border-color:var(--ac);color:#1a1200;font-weight:600}
[data-theme=light] .go{color:#fff}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px}
.msg{color:var(--mu);margin:8px 0;min-height:1.5em}
.err{color:var(--bad)}
.frame{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage{background:var(--pn);border-radius:14px;padding:16px;margin-top:16px}
.nb{color:var(--mu);font:.95rem var(--f);min-height:1.4em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#line{font:clamp(1.35rem,5vw,1.8rem)/1.55 var(--f);color:var(--mu);margin:10px 0;min-height:4.7em;white-space:pre-wrap;word-break:break-word}
#line .ok{color:var(--ok)}
#line .bad{color:var(--bad);text-decoration:underline}
#line .cur{color:var(--ink);border-bottom:2px solid var(--ac)}
#typed{font-family:var(--f);margin-top:8px}
#lang{margin-bottom:12px}
.stats{display:flex;gap:28px;margin-top:14px;color:var(--mu);font-size:.85rem}
.stats b{display:block;color:var(--ink);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
.item{display:block;width:100%;text-align:left;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details{margin-top:24px}
summary{cursor:pointer;padding:8px 0;font-weight:600}
label.o{display:flex;align-items:center;gap:10px;padding:8px 0}
label.o input{width:20px;height:20px}
a{color:var(--ac)}
.lb{display:block;color:var(--mu);margin:12px 0 6px;font-size:.9rem}
</style>
</head>
<body>
<main>
<header><h1>Тап</h1><button id="theme" type="button">Светлая / тёмная</button></header>
<div class="row"><input id="link" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Ссылка на видео (необязательно)" aria-label="Ссылка на YouTube"><button id="go" class="go" type="button">Начать</button></div>
<p id="msg" class="msg" role="status"></p>
<div class="frame"><div id="player"></div></div>
<div class="stage">
<select id="lang" hidden aria-label="Язык субтитров"></select>
<div id="prev" class="nb"></div>
<div id="line"></div>
<div id="next" class="nb"></div>
<input id="typed" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="Печатай здесь" disabled aria-label="Поле для печати">
<div class="stats"><div><b id="wpm">0</b>слов/мин</div><div><b id="acc">100%</b>точность</div><div><b id="pos">—</b>строка</div><div><b id="n">0</b>готово</div></div>
</div>
<h2>Недавние</h2>
<div id="hist"></div>
<details>
<summary>Настройки</summary>
<p class="msg">Перетащи эту ссылку на панель закладок браузера (Ctrl+Shift+B): <a id="bm" href="#">Субтитры для Тап</a></p>
<label class="lb" for="api">Свой сервер субтитров (необязательно)</label>
<input id="api" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://tap-subs.твоё-имя.workers.dev">
<label class="o"><input id="hl" type="checkbox"> Подсветка ошибок</label>
<label class="o"><input id="ps" type="checkbox"> Пауза видео при ошибке</label>
<label class="o"><input id="snd" type="checkbox"> Звук клавиш</label>
<label class="lb" for="font">Шрифт</label>
<select id="font"><option value="serif">С засечками</option><option value="sans">Без засечек</option><option value="mono">Моноширинный</option></select>
</details>
<details>
<summary>Субтитры вручную</summary>
<p class="msg">Если сервер не достал субтитры: вставь ссылку сверху, сюда текст SRT или VTT.</p>
<textarea id="subs" rows="6" spellcheck="false"></textarea>
<p><button id="manual" type="button">Использовать</button></p>
</details>
</main>
<script>
const $=i=>document.getElementById(i);
const FONTS={serif:'Literata,Georgia,serif',sans:'Inter,system-ui,sans-serif',mono:'"JetBrains Mono",ui-monospace,monospace'};
const S={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg=Object.assign({dark:true,hl:true,pause:true,sound:true,font:'serif',api:''},S.get('tap-cfg',{}));
let hist=S.get('tap-hist',[]),cues=[],idx=-1,done=false,prev=0,hold=false,vid=null;
let st={ok:0,all:0,t0:0,n:0},yt=null,apiOk=false,ready=false,queue=null,actx=null;
const typed=$('typed');
const fold=s=>s.replace(/[‘’ʼ]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-');
const same=(a,b)=>fold(a)===fold(b);
const wrong=(v,t)=>{for(let k=0;k<v.length;k++)if(k>=t.length||!same(v[k],t[k]))return true;return false};
const ytId=s=>{s=s.trim();if(/^[\w-]{11}$/.test(s))return s;const m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);return m&&m[1]};
function msg(t,err){const m=$('msg');m.textContent=t;m.className='msg'+(err?' err':'')}

const bmk=async()=>{try{
 const q=new URLSearchParams(location.search).get('v')||((location.pathname.match(/\/(?:shorts|live)\/([\w-]{11})/)||[])[1]);
 if(!q){alert('Открой страницу видео на YouTube и нажми закладку ещё раз.');return}
 const r=await fetch('/youtubei/v1/player?prettyPrint=false',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({context:{client:{clientName:'ANDROID',clientVersion:'20.10.38',androidSdkVersion:34,hl:'en'}},videoId:q})});
 const d=await r.json(),L=((d.captions||{}).playerCaptionsTracklistRenderer||{}).captionTracks||[];
 if(!L.length){alert('Субтитры не найдены: '+((d.playabilityStatus||{}).reason||'у видео их нет'));return}
 const p=L.find(t=>t.kind!=='asr')||L[0];
 const c=JSON.parse(await(await fetch(p.baseUrl+'&fmt=json3')).text());
 const cues=[];let cur=null;
 for(const e of c.events||[]){if(!e.segs)continue;const t=e.segs.map(x=>x.utf8).join('').replace(/\s+/g,' ').trim();if(!t)continue;const s=e.tStartMs/1000,end=s+(e.dDurationMs||0)/1000;
  if(cur&&s-cur.end<1.2&&cur.text.length+t.length<60&&!/[.!?…]$/.test(cur.text)){cur.text+=' '+t;cur.end=end}else{cur={start:s,end:end,text:t};cues.push(cur)}}
 const j=JSON.stringify({v:q,title:(d.videoDetails||{}).title||'',lang:p.languageCode,cues:cues});
 try{await navigator.clipboard.writeText(j);alert('Готово: скопировано строк: '+cues.length+'. Вернись на сайт «Тап» и нажми «Начать».')}
 catch(e){prompt('Скопируй этот текст (Ctrl+C), потом на сайте «Тап» нажми «Начать»:',j)}
}catch(e){alert('Ошибка: '+e.message)}};
$('bm').href='javascript:'+encodeURIComponent('('+bmk.toString()+')()');
async function fromClip(){try{const j=JSON.parse(await navigator.clipboard.readText());if(!j.v||!j.cues||!j.cues.length)throw 0;
 $('link').value='https://youtu.be/'+j.v;load(j.v,null,{cues:j.cues,title:j.title})}
 catch(e){msg('Сначала открой видео на YouTube и нажми закладку «Субтитры для Тап» (она в «Настройках»). Потом вернись сюда и нажми «Начать».',true)}}

function parseSubs(raw){const o=[];const sec=s=>s.trim().replace(',','.').split(':').reduce((p,v)=>p*60+parseFloat(v),0);
 raw.replace(/\r/g,'').split(/\n\s*\n/).forEach(b=>{const l=b.split('\n'),i=l.findIndex(x=>x.includes('-->'));if(i<0)return;
  const [a,z]=l[i].split('-->'),s=sec(a),e=sec(z.trim().split(/\s+/)[0]);
  const t=l.slice(i+1).join(' ').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
  if(t&&!isNaN(s))o.push({start:s,end:isNaN(e)?s+3:e,text:t})});
 return o.sort((a,b)=>a.start-b.start)}
const active=t=>{let lo=0,hi=cues.length-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(cues[m].start<=t){r=m;lo=m+1}else hi=m-1}return r};

function tick(){if(!cfg.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
 const n=Math.floor(actx.sampleRate*.012),b=actx.createBuffer(1,n,actx.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,8);
 const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
 f.type='bandpass';f.frequency.value=2200+Math.random()*700;f.Q.value=.9;g.gain.value=.5;
 s.buffer=b;s.connect(f);f.connect(g);g.connect(actx.destination);s.start()}catch(e){}}

function render(){
 const t=idx>=0?cues[idx].text:'',v=typed.value,f=document.createDocumentFragment();
 for(let k=0;k<Math.max(t.length,v.length);k++){const s=document.createElement('span');s.textContent=k<t.length?t[k]:v[k];
  if(k<v.length){const g=k<t.length&&same(v[k],t[k]);s.className=cfg.hl?(g?'ok':'bad'):'ok'}else if(k===v.length)s.className='cur';f.append(s)}
 $('line').replaceChildren(f);
 $('prev').textContent=idx>0?cues[idx-1].text:'';
 $('next').textContent=idx>=0&&cues[idx+1]?cues[idx+1].text:'';
}
function setLine(i){idx=i;done=false;prev=0;hold=false;typed.value='';render();$('pos').textContent=i>=0?(i+1)+'/'+cues.length:'—';msg(i>=0?'':'Жду первую строку…')}
function stat(){const m=st.t0?(Date.now()-st.t0)/6e4:0;$('wpm').textContent=m>.02?Math.round(st.ok/5/m):0;$('acc').textContent=(st.all?Math.round(st.ok/st.all*100):100)+'%';$('n').textContent=st.n}

typed.addEventListener('input',()=>{
 if(idx<0||done){typed.value='';prev=0;return}
 const t=cues[idx].text,v=typed.value;
 if(v.length>prev){if(!st.t0)st.t0=Date.now();for(let k=prev;k<v.length;k++){st.all++;if(k<t.length&&same(v[k],t[k]))st.ok++}tick()}
 prev=v.length;
 const w=wrong(v,t);
 if(v.length&&same(v,t)){done=true;st.n++;msg('Готово. Жди следующую строку.')}else msg(w?'Ошибка. Исправь её.':'',w);
 if(cfg.pause&&ready){if(w){yt.pauseVideo();hold=true}else if(hold){yt.playVideo();hold=false}}
 render();stat();
});
setInterval(()=>{if(!ready||!cues.length)return;const i=active(yt.getCurrentTime());if(i!==idx)setLine(i);if(st.t0)stat()},200);

function play(id){
 if(!apiOk){queue=id;return}
 if(!yt){yt=new YT.Player('player',{videoId:id,width:'100%',height:'100%',playerVars:{playsinline:1,rel:0},events:{onReady:()=>{ready=true;if(queue){yt.loadVideoById(queue);queue=null}}}})}
 else if(ready)yt.loadVideoById(id);else queue=id;
}
window.onYouTubeIframeAPIReady=()=>{apiOk=true;if(queue){const q=queue;queue=null;play(q)}};

async function load(id,lang,manual){
 vid=id;msg('Ищу субтитры…');
 try{
  let d;
  if(manual)d=Array.isArray(manual)?{cues:manual,tracks:[],title:(hist.find(h=>h.id===id)||{}).title||'Видео'}:{cues:manual.cues,tracks:[],title:manual.title};
  else{
   if(!cfg.api)throw new Error('Не указан адрес сервера субтитров. Открой «Настройки».');
   let r;try{r=await fetch(cfg.api.replace(/\/$/,'')+'/?v='+id+(lang?'&lang='+lang:''))}catch(e){throw new Error('Сервер субтитров не отвечает.')}
   d=await r.json();if(d.error)throw new Error(d.error);
  }
  if(!d.cues||!d.cues.length)throw new Error('В субтитрах нет строк.');
  cues=d.cues;
  hist=[{id,title:d.title||'Видео'},...hist.filter(h=>h.id!==id)].slice(0,20);S.set('tap-hist',hist);drawHist();
  const L=$('lang');L.replaceChildren();
  (d.tracks||[]).forEach(t=>{const o=document.createElement('option');o.value=t.lang;o.textContent=t.name+(t.auto?' (авто)':'');L.append(o)});
  L.value=d.lang||'';L.hidden=!d.tracks||d.tracks.length<2;
  st={ok:0,all:0,t0:0,n:0};typed.disabled=false;setLine(-1);stat();play(id);
  msg('Если видео не пошло, нажми Play.');
 }catch(e){msg(e.message+' Можно вставить субтитры вручную внизу.',true)}
}
function drawHist(){const h=$('hist');h.replaceChildren();
 if(!hist.length){h.textContent='Здесь появятся открытые видео.';h.className='msg';return}
 h.className='';
 hist.forEach(v=>{const b=document.createElement('button');b.type='button';b.className='item';b.textContent=v.title;
  b.onclick=()=>{$('link').value='https://youtu.be/'+v.id;load(v.id)};h.append(b)})}

$('go').onclick=()=>{const id=ytId($('link').value);if(!cfg.api)return fromClip();if(!id)return msg('Не нашёл видео в ссылке.',true);load(id)};
$('link').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('lang').onchange=()=>load(vid,$('lang').value);
$('manual').onclick=()=>{const id=ytId($('link').value);if(!id)return msg('Сначала вставь ссылку на видео сверху.',true);
 const c=parseSubs($('subs').value);if(!c.length)return msg('Нужен текст SRT или VTT с таймкодами.',true);load(id,null,c)};

function apply(){const r=document.documentElement;r.dataset.theme=cfg.dark?'dark':'light';r.style.setProperty('--f',FONTS[cfg.font]);
 $('hl').checked=cfg.hl;$('ps').checked=cfg.pause;$('snd').checked=cfg.sound;$('font').value=cfg.font;$('api').value=cfg.api;S.set('tap-cfg',cfg)}
$('theme').onclick=()=>{cfg.dark=!cfg.dark;apply()};
[['hl','hl'],['ps','pause'],['snd','sound']].forEach(([i,k])=>$(i).onchange=()=>{cfg[k]=$(i).checked;apply();render()});
$('font').onchange=()=>{cfg.font=$('font').value;apply()};
$('api').onchange=()=>{cfg.api=$('api').value.trim();apply()};
apply();drawHist();render();stat();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
